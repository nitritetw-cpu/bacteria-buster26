<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bacteria Buster - 醜惡細菌大作戰</title>
  <style>
    body {
      margin: 0;
      background: #0a0d14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      user-select: none;
      overflow: hidden;
    }
    canvas {
      background: #10141d;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      cursor: none; /* 隱藏系統預設滑鼠指標 */
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const COLORS = ["#477328", "#5e2b6e", "#9e5c1e", "#852323", "#3d5c52"];

let score = 0;
let timeLeft = 30;
let gameOver = false;
let lastTimerUpdate = Date.now();

// 滑鼠游標與開火特效追蹤
let mouseX = WIDTH / 2;
let mouseY = HEIGHT / 2;
let gunRecoil = 0;
let muzzleFlash = 0;

canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 5 + 2;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd;
    this.life = 15;
    this.r = Math.random() * 3 + 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    return this.life > 0;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

class Bacteria {
  constructor() {
    this.r = Math.floor(Math.random() * 12 + 28);
    this.x = Math.random() * (WIDTH - this.r * 2 - 120) + this.r + 60;
    this.y = Math.random() * (HEIGHT - this.r * 2 - 120) + this.r + 60;

    const speed = Math.random() * 1.5 + 2.2;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.faceType = Math.floor(Math.random() * 3);
    this.phase = Math.random() * Math.PI * 2;

    this.flagellaCount = Math.floor(Math.random() * 3 + 6);
    this.flagella = [];
    for (let i = 0; i < this.flagellaCount; i++) {
      this.flagella.push({
        len: this.r * (Math.random() * 0.6 + 1.2),
        offset: (i - (this.flagellaCount - 1) / 2) * 0.25,
        speed: Math.random() * 0.8 + 1.2,
        shift: Math.random() * Math.PI * 2
      });
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.phase += 0.2;

    if (this.x - this.r <= 0 || this.x + this.r >= WIDTH ||
        this.y - this.r <= 0 || this.y + this.r >= HEIGHT) {
      return false;
    }
    return true;
  }

  draw() {
    const moveAngle = Math.atan2(this.vy, this.vx) + Math.PI;

    // 鞭毛繪製
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    for (const fl of this.flagella) {
      const tAngle = moveAngle + fl.offset;
      const wobble = Math.sin(this.phase * fl.speed + fl.shift) * 12;

      const sx = this.x + Math.cos(tAngle) * (this.r * 0.9);
      const sy = this.y + Math.sin(tAngle) * (this.r * 0.9);
      const mx = sx + Math.cos(tAngle) * (fl.len * 0.5) + Math.sin(tAngle) * wobble;
      const my = sy + Math.sin(tAngle) * (fl.len * 0.5) - Math.cos(tAngle) * wobble;
      const ex = mx + Math.cos(tAngle) * (fl.len * 0.5) - Math.sin(tAngle) * wobble;
      const ey = my + Math.sin(tAngle) * (fl.len * 0.5) + Math.cos(tAngle) * wobble;

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(mx, my, ex, ey);
      ctx.stroke();
    }

    // 肉體
    ctx.fillStyle = this.color;
    ctx.strokeStyle = "#1b2416";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 醜惡面容
    if (this.faceType === 0) {
      const eyes = [{ox: -0.4, oy: -0.2, er: 7}, {ox: 0.0, oy: -0.35, er: 9}, {ox: 0.45, oy: -0.15, er: 6}];
      eyes.forEach(e => {
        ctx.fillStyle = "#ffe5e5";
        ctx.beginPath();
        ctx.arc(this.x + this.r * e.ox, this.y + this.r * e.oy, e.er, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#990000";
        ctx.beginPath();
        ctx.arc(this.x + this.r * e.ox, this.y + this.r * e.oy, e.er / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(this.x - this.r * 0.4, this.y + this.r * 0.2);
      ctx.lineTo(this.x, this.y + this.r * 0.5);
      ctx.lineTo(this.x + this.r * 0.4, this.y + this.r * 0.2);
      ctx.stroke();

    } else if (this.faceType === 1) {
      ctx.fillStyle = "#fff0f0";
      ctx.beginPath();
      ctx.arc(this.x, this.y - 4, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(this.x, this.y - 4, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ff3333";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.x - this.r * 0.5, this.y + this.r * 0.4);
      for (let k = 0; k < 5; k++) {
        const kx = this.x - this.r * 0.5 + (k + 1) * (this.r * 0.2);
        const ky = this.y + this.r * 0.4 + (k % 2 === 0 ? 8 : -8);
        ctx.lineTo(kx, ky);
      }
      ctx.stroke();

    } else {
      [-1, 1].forEach(mult => {
        ctx.fillStyle = "#fff2a3";
        ctx.beginPath();
        ctx.arc(this.x + mult * this.r * 0.35, this.y - this.r * 0.1, 6, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.x - this.r * 0.5, this.y - this.r * 0.4);
      ctx.lineTo(this.x - this.r * 0.15, this.y - this.r * 0.2);
      ctx.moveTo(this.x + this.r * 0.15, this.y - this.r * 0.2);
      ctx.lineTo(this.x + this.r * 0.5, this.y - this.r * 0.4);
      ctx.stroke();
      ctx.strokeStyle = "#fff";
      ctx.beginPath();
      ctx.moveTo(this.x - this.r * 0.2, this.y + this.r * 0.2);
      ctx.lineTo(this.x - this.r * 0.2, this.y + this.r * 0.5);
      ctx.moveTo(this.x + this.r * 0.2, this.y + this.r * 0.2);
      ctx.lineTo(this.x + this.r * 0.2, this.y + this.r * 0.5);
      ctx.stroke();
    }
  }
}

// 繪製 Sniper / Snapper Gun 狙擊槍瞄準鏡
function drawSniperReticle(x, y) {
  const radius = 26 + gunRecoil;

  // 1. 擊發火花特效
  if (muzzleFlash > 0) {
    ctx.strokeStyle = `rgba(255, 230, 80, ${muzzleFlash / 6})`;
    ctx.fillStyle = `rgba(255, 100, 0, ${muzzleFlash / 8})`;
    ctx.beginPath();
    ctx.arc(x, y, radius + 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // 2. 外部瞄準環
  ctx.strokeStyle = "rgba(0, 255, 170, 0.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();

  // 3. 四方狙擊咬爪 (Snapper Claws / Brackets)
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#00ffcc";
  const clawDist = radius + 6;
  const clawSize = 9;

  // 上爪
  ctx.beginPath();
  ctx.moveTo(x - clawSize, y - clawDist);
  ctx.lineTo(x, y - clawDist - 4);
  ctx.lineTo(x + clawSize, y - clawDist);
  ctx.stroke();

  // 下爪
  ctx.beginPath();
  ctx.moveTo(x - clawSize, y + clawDist);
  ctx.lineTo(x, y + clawDist + 4);
  ctx.lineTo(x + clawSize, y + clawDist);
  ctx.stroke();

  // 左爪
  ctx.beginPath();
  ctx.moveTo(x - clawDist, y - clawSize);
  ctx.lineTo(x - clawDist - 4, y);
  ctx.lineTo(x - clawDist, y + clawSize);
  ctx.stroke();

  // 右爪
  ctx.beginPath();
  ctx.moveTo(x + clawDist, y - clawSize);
  ctx.lineTo(x + clawDist + 4, y);
  ctx.lineTo(x + clawDist, y + clawSize);
  ctx.stroke();
